name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Windows / MSVC ─────────────────────────────────────────────────────────
  windows-msvc:
    name: Windows MSVC (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DMEMORYPACK_BUILD_TESTS=ON
          -DMEMORYPACK_BUILD_SAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # ── 2. Linux / GCC 13, 14 ─────────────────────────────────────────────────────
  linux-gcc:
    name: Linux GCC ${{ matrix.gcc }} (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install g++-${{ matrix.gcc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.gcc }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }}
          -DMEMORYPACK_BUILD_TESTS=ON
          -DMEMORYPACK_BUILD_SAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── 3. Linux / Clang 17, 18 ───────────────────────────────────────────────────
  # apt.llvm.org publishes clang-17 for jammy and clang-18 for noble, so each
  # clang version is pinned to the runner image whose repository actually has it.
  linux-clang:
    name: Linux Clang ${{ matrix.clang }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - clang: 17
            os: ubuntu-22.04
            libstdcxx: g++-12
            build_type: Release
          - clang: 18
            os: ubuntu-24.04
            libstdcxx: g++-13
            build_type: Debug
          - clang: 18
            os: ubuntu-24.04
            libstdcxx: g++-13
            build_type: Release
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install Clang ${{ matrix.clang }} and ${{ matrix.libstdcxx }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.libstdcxx }} lsb-release wget software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.clang }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
          -DMEMORYPACK_BUILD_TESTS=ON
          -DMEMORYPACK_BUILD_SAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── 4. macOS / Apple Clang ────────────────────────────────────────────────────
  macos:
    name: macOS Apple Clang (${{ matrix.build_type }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMEMORYPACK_BUILD_TESTS=ON
          -DMEMORYPACK_BUILD_SAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── 5. Sanitizers (ASan + UBSan) ──────────────────────────────────────────────
  sanitizers:
    name: Sanitizers (Clang ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DMEMORYPACK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # ── 6. -fno-exceptions / -fno-rtti ────────────────────────────────────────────
  # Exercises the MEMORYPACK_NO_EXCEPTIONS path (auto-detected via __cpp_exceptions).
  no-exceptions:
    name: No exceptions / no RTTI (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install g++-13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      - name: Library headers compile without exceptions or RTTI
        run: |
          mkdir -p build-noexcept
          printf '#include "memorypack/memorypack.hpp"\nint main() { return 0; }\n' > build-noexcept/tu.cpp
          g++-13 -std=c++23 -fno-exceptions -fno-rtti -Iinclude -Wall -Wextra -Wpedantic \
            -c build-noexcept/tu.cpp -o build-noexcept/tu.o

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_CXX_FLAGS="-fno-exceptions -fno-rtti"
          -DMEMORYPACK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── 7. Big-endian (s390x) ─────────────────────────────────────────────────────
  big-endian:
    name: Big-endian s390x (proves the endian conversion path; advisory only)
    runs-on: ubuntu-latest
    continue-on-error: true
    # packages: write lets run-on-arch-action cache its emulation image in GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test under emulated s390x
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: s390x
          distro: ubuntu22.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          install: |
            apt-get update -q
            apt-get install -y g++-12 cmake make
          run: |
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-12 \
              -DMEMORYPACK_BUILD_TESTS=ON
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure

  # ── 8. .NET build + golden fixture verification ───────────────────────────────
  dotnet:
    name: .NET 10 build + FormatProbe fixture verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build cs2cpp
        run: dotnet build tools/cs2cpp/cs2cpp.csproj -c Release

      - name: Build FormatProbe
        run: dotnet build tools/FormatProbe/FormatProbe.csproj -c Release

      - name: Build CSharpServer
        run: dotnet build samples/CSharpServer/CSharpServer.csproj -c Release

      - name: Build ChatServer
        run: dotnet build samples/ChatServer/ChatServer.csproj -c Release

      - name: Verify committed fixtures still match MemoryPack
        run: dotnet run --project tools/FormatProbe -c Release -- verify tests/fixtures

  # ── 9. C++ / C# interop ───────────────────────────────────────────────────────
  interop:
    name: Interop (C++ writes fixtures, C# validates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: lukka/get-cmake@latest

      - name: Install g++-13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      - name: Configure and build C++ tests
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DMEMORYPACK_BUILD_TESTS=ON
          cmake --build build --parallel

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Export C++-produced fixtures
        run: |
          mkdir -p build/cpp-fixtures
          if [ -x build/tests/memorypack_interop_tests ]; then
            # memorypack_interop_tests <fixtureDir> <outputDir>
            ./build/tests/memorypack_interop_tests tests/fixtures "$PWD/build/cpp-fixtures"
          else
            ./build/tests/memorypack_tests "$PWD/build/cpp-fixtures"
          fi

      - name: Validate C++ output with FormatProbe check-cpp
        run: |
          if ! ls build/cpp-fixtures/*.bin >/dev/null 2>&1; then
            echo "::warning::The C++ test binary wrote no .bin files into build/cpp-fixtures - skipping check-cpp."
            exit 0
          fi
          dotnet run --project tools/FormatProbe -c Release -- check-cpp build/cpp-fixtures

  # ── 10. cs2cpp generated headers are up to date ───────────────────────────────
  cs2cpp-check:
    name: cs2cpp output matches committed headers
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: cs2cpp unit and snapshot tests
        run: dotnet test tools/cs2cpp.Tests -c Release

      # --check regenerates in memory and prints a unified diff instead of
      # writing, so a drifted header fails the build with a readable message.
      - name: samples/CppClient/packets.hpp is up to date
        run: |
          dotnet run --project tools/cs2cpp -c Release --             samples/CSharpServer/Packets.cs -o samples/CppClient/packets.hpp --check

      - name: samples/ChatClient/packets.hpp is up to date
        run: |
          dotnet run --project tools/cs2cpp -c Release --             samples/ChatServer/Packets.cs -o samples/ChatClient/packets.hpp --check

  # ── 11. Standalone example programs ───────────────────────────────────────────
  examples:
    name: Examples compile standalone (GCC 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install g++-13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      - name: Compile every examples/*.cpp
        shell: bash
        run: |
          shopt -s nullglob
          files=(examples/*.cpp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No examples/*.cpp present yet - nothing to compile."
            exit 0
          fi
          mkdir -p build-examples
          for f in "${files[@]}"; do
            echo "== $f"
            g++-13 -std=c++23 -Iinclude -Wall -Wextra -Werror \
              "$f" -o "build-examples/$(basename "${f%.cpp}")"
          done
