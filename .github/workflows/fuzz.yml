name: Fuzz

on:
  schedule:
    # Every Monday at 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-deserialize:
    name: libFuzzer deserialize (10 minutes, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Look for the fuzz target
        id: probe
        run: |
          if [ -f tests/fuzz/fuzz_deserialize.cpp ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/fuzz/fuzz_deserialize.cpp does not exist yet - nothing to fuzz."
          fi

      - name: Install Clang
        if: steps.probe.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz target
        if: steps.probe.outputs.found == 'true'
        run: |
          clang++ -std=c++23 -g -O1 -Iinclude \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            tests/fuzz/fuzz_deserialize.cpp -o fuzz_deserialize

      - name: Seed corpus from committed fixtures
        if: steps.probe.outputs.found == 'true'
        run: |
          mkdir -p corpus artifacts
          if ls tests/fixtures/*.bin >/dev/null 2>&1; then
            cp tests/fixtures/*.bin corpus/
          fi

      - name: Run fuzzer for 600 seconds
        if: steps.probe.outputs.found == 'true'
        run: |
          ./fuzz_deserialize corpus \
            -max_total_time=600 \
            -print_final_stats=1 \
            -artifact_prefix=artifacts/

      - name: Upload crash artifacts
        if: failure() && steps.probe.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/
          if-no-files-found: ignore
